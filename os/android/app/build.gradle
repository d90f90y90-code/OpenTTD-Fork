plugins {
    id 'com.android.application'
}

// Release signing key comes from the CI environment so every build has the same signature
// (needed to update the app without uninstalling it first).
def forkKeystoreFile = System.getenv('FORK_KEYSTORE_FILE')

android {
    namespace 'org.openttdfork.game'
    compileSdk 34

    defaultConfig {
        applicationId 'org.openttdfork.game'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0-fork'
    }

    signingConfigs {
        if (forkKeystoreFile) {
            fork {
                storeFile file(forkKeystoreFile)
                storeType 'pkcs12'
                storePassword System.getenv('FORK_KEYSTORE_PASSWORD')
                keyAlias 'openttdfork'
                keyPassword System.getenv('FORK_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig forkKeystoreFile ? signingConfigs.fork : signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            // Only the x86_64 build used for the emulator test keeps its function names.
            keepDebugSymbols += ['**/x86_64/libmain.so']
        }
    }
}
